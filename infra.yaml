AWSTemplateFormatVersion: '2010-09-09'
Description: 'Plantilla con un bucket S3 y una instancia EC2 con Apache'

Parameters:
  NombreDelBucket:
    Type: String
    Description: Prefijo para el nombre del bucket S3
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9.-]+$'
    ConstraintDescription: "Debe contener solo letras minúsculas, números, guiones y puntos"

  NombreInstancia:
    Type: String
    Description: Nombre para la instancia EC2

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nombre del Key Pair para conexión SSH

Resources:

  MiBucketS3:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub '${NombreDelBucket}-bucket'

  MiSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow HTTP and SSH traffic'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  MiInstanciaEC2:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316  # Amazon Linux 2 - us-east-1
      SecurityGroupIds:
        - !Ref MiSecurityGroup
      KeyName: !Ref KeyName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "¡Hola desde EC2 con Apache!" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: !Ref NombreInstancia

Outputs:
  NombreDelBucketOutput:
    Description: Nombre del bucket S3
    Value: !Ref MiBucketS3
    Export:
      Name: NombreBucketS3

  ARNBucket:
    Description: ARN del bucket S3
    Value: !GetAtt MiBucketS3.Arn
    Export:
      Name: ARNBucketS3

  InstanciaId:
    Description: ID de la instancia EC2
    Value: !Ref MiInstanciaEC2
    Export:
      Name: IdInstanciaEC2
